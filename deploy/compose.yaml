name: proclama

services:
  proxy:
    image: ${NGINX_IMAGE:-nginxinc/nginx-unprivileged:1.28-alpine}
    ports: ["8080:8080"]
    read_only: true
    tmpfs: ["/tmp"]
    volumes:
      - ../proxy/${PROXY_CONF:-default.conf}:/etc/nginx/conf.d/default.conf:ro
    networks: [edge]
    depends_on:
      web: { condition: service_healthy }
      api: { condition: service_healthy }

  web:
    build:
      context: ../web
      args: { APP_VERSION: "${APP_VERSION:-dev}" }
    image: proclama/web:${APP_VERSION:-dev}
    networks: [edge]

  api:
    build:
      context: ../api
      args: { APP_VERSION: "${APP_VERSION:-dev}" }
    image: proclama/api:${APP_VERSION:-dev}
    environment:
      DATABASE_URL: postgres://proclama:${DB_PASSWORD:?DB_PASSWORD manquant}@db:5432/proclama
      DB_POOL_SIZE: "10"
      S3_ENDPOINT: http://s3:8333
      S3_BUCKET: proclama
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?S3_ACCESS_KEY manquant}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?S3_SECRET_KEY manquant}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET manquant}
      APP_VERSION: ${APP_VERSION:-dev}
      ENABLE_DEBUG: ${ENABLE_DEBUG:-false}
      RATE_LIMIT_PER_MIN: ${RATE_LIMIT_PER_MIN:-30}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-admin@proclama.local}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:?BOOTSTRAP_ADMIN_PASSWORD manquant}
      LOG_LEVEL: info
    networks: [edge, backend]
    deploy:
      resources:
        limits: { cpus: "0.50", memory: 384M }
    depends_on:
      db: { condition: service_healthy }
      s3: { condition: service_started }

  worker:
    image: proclama/api:${APP_VERSION:-dev}
    pull_policy: never
    command: ["java", "-jar", "app.jar", "--app.mode=worker", "--spring.main.web-application-type=none"]
    environment:
      DATABASE_URL: postgres://proclama:${DB_PASSWORD:?DB_PASSWORD manquant}@db:5432/proclama
      DB_POOL_SIZE: "5"
      S3_ENDPOINT: http://s3:8333
      S3_BUCKET: proclama
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?S3_ACCESS_KEY manquant}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?S3_SECRET_KEY manquant}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET manquant}
      APP_VERSION: ${APP_VERSION:-dev}
      INSTANCE_NAME: worker
      WORKER_INTERVAL_SECONDS: "5"
    healthcheck:
      disable: true
    networks: [backend]
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
      s3: { condition: service_started }
      api: { condition: service_healthy }

  db:
    image: ${POSTGRES_IMAGE:-postgres:17-alpine}
    environment:
      POSTGRES_DB: proclama
      POSTGRES_USER: proclama
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD manquant}
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U proclama -d proclama"]
      interval: 5s
      retries: 10
    networks: [backend]

  s3:
    image: ${S3_IMAGE:-chrislusf/seaweedfs:3.80}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        echo "{\"identities\":[{\"name\":\"proclama\",\"credentials\":[{\"accessKey\":\"$$S3_ACCESS_KEY\",\"secretKey\":\"$$S3_SECRET_KEY\"}],\"actions\":[\"Admin\",\"Read\",\"Write\",\"List\",\"Tagging\"]}]}" > /tmp/s3.json &&
        exec weed server -dir=/data -s3 -s3.config=/tmp/s3.json -master.volumeSizeLimitMB=256 -volume.max=0
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?S3_ACCESS_KEY manquant}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?S3_SECRET_KEY manquant}
    volumes: ["s3data:/data"]
    networks: [backend]

volumes:
  pgdata:
  s3data:

networks:
  edge:     
  backend:
    internal: true
