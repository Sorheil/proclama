name: proclama

services:
  db:
    image: ${POSTGRES_IMAGE}
    environment:
      POSTGRES_DB: proclama
      POSTGRES_USER: proclama
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U proclama -d proclama"]
      interval: 5s
      retries: 10
    networks:
      - backend

  
  s3:
    image: ${S3_IMAGE}
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?S3_ACCESS_KEY is required}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?S3_SECRET_KEY is required}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "{\"identities\":[{\"name\":\"proclama\",\"credentials\":[{\"accessKey\":\"$$S3_ACCESS_KEY\",\"secretKey\":\"$$S3_SECRET_KEY\"}],\"actions\":[\"Admin\",\"Read\",\"Write\",\"List\",\"Tagging\"]}]}" > /tmp/s3.json
        exec weed server -dir=/data -s3 -s3.config=/tmp/s3.json -master.volumeSizeLimitMB=256 -volume.max=0
    volumes:
      - s3data:/data
    networks:
      - backend


volumes:
  pgdata:
  s3data:

networks:
  backend:
    internal: true