# Proxy inverse avec micro-cache de 1 s sur la liste des sessions et le statut d'une session.
proxy_cache_path /tmp/nginx-cache levels=1:2 keys_zone=status:1m max_size=10m inactive=10s use_temp_path=off;
# DNS interne de Docker : permet de résoudre "api" et "web" au moment des requêtes.
resolver 127.0.0.11 valid=5s;

server {
  listen 8080;
  set $api http://api:8080;
  set $web http://web:8080;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;

  # micro-cache : liste des sessions et statut d'une session
  location ~ ^/api/sessions(/[^/]+/status)?$ {
    proxy_pass $api;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Request-Id $request_id;
    proxy_cache status;
    proxy_cache_valid 200 1s;
    proxy_cache_lock on;
    proxy_cache_use_stale updating error timeout;
    add_header X-Cache-Status $upstream_cache_status always;
  }

  location /api/ {
    proxy_pass $api;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Request-Id $request_id;
    client_max_body_size 11m;
  }

  location / {
    proxy_pass $web;
    proxy_set_header Host $host;
  }
}
